services:
  - type: web
    name: skillswap-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: SKILLSWAP_CORS_ALLOWED_ORIGINS
        value: http://localhost:4200,http://127.0.0.1:4200,https://frontend-six-taupe-c8r0pelv2y.vercel.app
