spring.application.name=skillswap-api
server.port=${PORT:8080}

# =========================
# Elasticsearch
# =========================

spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
spring.elasticsearch.api-key=${ELASTICSEARCH_API_KEY:}
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=10s

# Evitar que Elasticsearch afecte el health general
management.health.elasticsearch.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# =========================
# CORS
# =========================

skillswap.cors.allowed-origins=${SKILLSWAP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}


# =========================
# PostgreSQL
# =========================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skillswap}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gael2004}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================
# JPA / Hibernate
# =========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================
# Inicializador de datos
# =========================

# Por defecto queda desactivado.
# Si algún día quieres activarlo:
# SKILLSWAP_DATA_INITIALIZER_ENABLED=true

skillswap.data-initializer.enabled=${SKILLSWAP_DATA_INITIALIZER_ENABLED:false}


# =========================
# Admin
# =========================

skillswap.admin.username=${SKILLSWAP_ADMIN_USERNAME:admin}
skillswap.admin.password=${SKILLSWAP_ADMIN_PASSWORD:SkillSwap123}